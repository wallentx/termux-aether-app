plugins {
    id "com.android.application"
}

// Explicit diagnostic mode: adds probes and restricts installation to Android 17.
def pixelProbe = providers.gradleProperty("pixelProbe").orNull == "true"
def arm64Only = rootProject.ext.termuxArm64Only
def appMinSdk = pixelProbe ? 37 : providers.gradleProperty("minSdkVersion").get().toInteger()
if (appMinSdk < 24) {
    throw new GradleException("Aether's bundled Shizuku API requires minSdkVersion >= 24")
}
def aetherOutputDirectory = layout.buildDirectory.dir("generated/aether")
// Pixel builds include the validated runtime. Keep the old property as an alias.
def aetherSetting = providers.gradleProperty("aetherEnabled")
    .orElse(providers.gradleProperty("aetherPrototype"))
    .getOrElse((arm64Only && !pixelProbe).toString())
if (!(aetherSetting in ["true", "false"])) {
    throw new GradleException("aetherEnabled must be true or false")
}
def aetherEnabled = aetherSetting == "true"
if (pixelProbe && gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }) {
    throw new GradleException("Pixel probes are debug-only; use :app:assembleDebug")
}

ext {
    // The packageVariant defines the bootstrap variant that will be included in the app APK.
    // This must be supported by com.termux.shared.termux.TermuxBootstrap.PackageVariant or app will
    // crash at startup.
    // Bootstrap of a different variant must not be manually installed by the user after app installation
    // by replacing $PREFIX since app code is dependant on the variant used to build the APK.
    // Supported: pacman-android-7 (default), apt-android-7, apt-android-5.
    packageVariant = System.getenv("TERMUX_PACKAGE_VARIANT") ?: "pacman-android-7"
}

android {
    buildFeatures {
        aidl = true
        buildConfig = true
    }
    namespace = "com.termux"

    if (pixelProbe) {
        compileSdk {
            version = release(37) { minorApiLevel = 2 }
        }
        buildToolsVersion = '37.0.0'
    } else {
        compileSdk = project.properties.compileSdkVersion.toInteger()
        compileSdkMinor = project.properties.compileSdkMinorVersion.toInteger()
    }
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion
    def appVersionName = System.getenv("TERMUX_APP_VERSION_NAME") ?: ""
    def apkVersionTag = System.getenv("TERMUX_APK_VERSION_TAG") ?: ""
    def splitAPKsForDebugBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS") ?: "1"
    def splitAPKsForReleaseBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS") ?: "0" // F-Droid does not support split APKs #1904

    dependencies {
        implementation "androidx.annotation:annotation:1.9.0"
        implementation "androidx.core:core:1.13.1"
        implementation "androidx.drawerlayout:drawerlayout:1.2.0"
        implementation "androidx.preference:preference:1.2.1"
        implementation "androidx.viewpager:viewpager:1.0.0"
        implementation "com.google.android.material:material:1.12.0"
        implementation "com.google.guava:guava:24.1-jre"
        implementation "io.noties.markwon:core:$markwonVersion"
        implementation "io.noties.markwon:ext-strikethrough:$markwonVersion"
        implementation "io.noties.markwon:linkify:$markwonVersion"
        implementation "io.noties.markwon:recycler:$markwonVersion"
        implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'

        implementation project(":terminal-view")
        implementation project(":termux-shared")
    }

    defaultConfig {
        minSdk = appMinSdk
        targetSdk = pixelProbe ? 37 : project.properties.targetSdkVersion.toInteger()
        // Reserve a high fork version range while leaving room for future upgrades.
        versionCode = 1000000000
        versionName = "1000.0.0"

        if (appVersionName) versionName = appVersionName
        validateVersionName(versionName)

        buildConfigField "String", "TERMUX_PACKAGE_VARIANT", "\"" + project.ext.packageVariant + "\"" // Used by TermuxApplication class

        manifestPlaceholders.TERMUX_PACKAGE_NAME = "com.termux"
        manifestPlaceholders.TERMUX_APP_NAME = "Termux"
        manifestPlaceholders.TERMUX_API_APP_NAME = "Termux:API"
        manifestPlaceholders.TERMUX_BOOT_APP_NAME = "Termux:Boot"
        manifestPlaceholders.TERMUX_FLOAT_APP_NAME = "Termux:Float"
        manifestPlaceholders.TERMUX_STYLING_APP_NAME = "Termux:Styling"
        manifestPlaceholders.TERMUX_TASKER_APP_NAME = "Termux:Tasker"
        manifestPlaceholders.TERMUX_WIDGET_APP_NAME = "Termux:Widget"

        externalNativeBuild {
            ndkBuild {
                cFlags "-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"
                if (pixelProbe) arguments "TERMUX_PIXEL_PROBE=1"
            }
        }

        if (arm64Only) {
            ndk { abiFilters 'arm64-v8a' }
        }

        splits {
            abi {
                enable = (!arm64Only && ((gradle.startParameter.taskNames.any { it.contains("Debug") } && splitAPKsForDebugBuilds == "1") ||
                    (gradle.startParameter.taskNames.any { it.contains("Release") } && splitAPKsForReleaseBuilds == "1")))
                reset ()
                if (arm64Only) {
                    include 'arm64-v8a'
                } else {
                    include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
                }
                universalApk = !arm64Only
            }
        }
    }

    signingConfigs {
        debug {
            storeFile = file('testkey_untrusted.jks')
            keyAlias = 'alias'
            storePassword = 'xrj45yWGLbsO7W0v'
            keyPassword = 'xrj45yWGLbsO7W0v'
        }
    }

    buildTypes {
        release {
            // Android run-as requires debuggable, including for the release execution service.
            debuggable = true
            minifyEnabled = true
            shrinkResources = false // Reproducible builds
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            signingConfig = signingConfigs.debug
        }
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled = true

        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            path = file("src/main/cpp/Android.mk")
        }
    }

    lint {
        disable 'ProtectedPermissions'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += '**/libaether-loader.so'
        }
    }

    if (aetherEnabled) {
        sourceSets.main.assets.srcDirs 'src/aether/assets', aetherOutputDirectory.map { it.dir('assets') }
        sourceSets.main.jniLibs.srcDirs 'src/aether/jniLibs', aetherOutputDirectory.map { it.dir('jniLibs') }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == "debug") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI) ?: (arm64Only ? 'arm64-v8a' : null)
                outputFileName = new File("termux-aether-app_" + (apkVersionTag ? apkVersionTag : project.ext.packageVariant + "-" + "debug") + "_" + (abi ? abi : "universal") + ".apk")
            } else if (variant.buildType.name == "release") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI) ?: (arm64Only ? 'arm64-v8a' : null)
                outputFileName = new File("termux-aether-app_" + (apkVersionTag ? apkVersionTag : project.ext.packageVariant + "-" + "release") + "_" + (abi ? abi : "universal") + ".apk")
            }
        }
    }

    if (pixelProbe) {
        sourceSets.debug {
            java.srcDir 'src/pixelProbe/java'
            manifest.srcFile 'src/pixelProbe/AndroidManifest.xml'
        }
    }
}

androidComponents {
    beforeVariants(selector().all()) { variantBuilder ->
        if (pixelProbe && variantBuilder.buildType != 'debug') variantBuilder.enable = false
    }
}

if (aetherEnabled) {
    def prepareAether = tasks.register('prepareAether', Exec) {
        workingDir rootProject.projectDir
        commandLine 'bash', 'scripts/aether/build.sh',
            aetherOutputDirectory.get().asFile, "${android.sdkDirectory}/ndk/${android.ndkVersion}"
    }
    tasks.named('preBuild').configure { dependsOn prepareAether }
}

dependencies {
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.10"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.1.5"
}

def configuredVersionName = android.defaultConfig.versionName
tasks.register('versionName') {
    doLast { print configuredVersionName }
}

def validateVersionName(String versionName) {
    // https://semver.org/spec/v2.0.0.html#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
    // ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    if (!java.util.regex.Pattern.matches("^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?\$", versionName))
        throw new GradleException("The versionName '"  + versionName + "' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html.")
}

def bootstrapProjectDirectory = layout.projectDirectory.asFile
def bootstrapLogger = logger
def downloadBootstrap = { String arch, String expectedChecksum, String version,
                          String repository = "termux/termux-packages" ->
    if (arm64Only && arch != "aarch64") return
    def digest = java.security.MessageDigest.getInstance("SHA-256")

    def localUrl = "src/main/cpp/bootstrap-" + arch + ".zip"
    def file = new File(bootstrapProjectDirectory, localUrl)
    if (file.exists()) {
        def buffer = new byte[8192]
        def input = new FileInputStream(file)
        while (true) {
            def readBytes = input.read(buffer)
            if (readBytes < 0) break
            digest.update(buffer, 0, readBytes)
        }
        def checksum = new BigInteger(1, digest.digest()).toString(16)
        while (checksum.length() < 64) { checksum = "0" + checksum }
        if (checksum == expectedChecksum) {
            return
        } else {
            bootstrapLogger.quiet("Deleting old local file with wrong hash: " + localUrl + ": expected: " + expectedChecksum + ", actual: " + checksum)
            file.delete()
        }
    }

    def remoteUrl = "https://github.com/" + repository + "/releases/download/bootstrap-" + version + "/bootstrap-" + arch + ".zip"
    bootstrapLogger.quiet("Downloading " + remoteUrl + " ...")

    file.parentFile.mkdirs()
    def out = new BufferedOutputStream(new FileOutputStream(file))

    def connection = new URL(remoteUrl).openConnection()
    connection.setInstanceFollowRedirects(true)
    def digestStream = new java.security.DigestInputStream(connection.inputStream, digest)
    out << digestStream
    out.close()

    def checksum = new BigInteger(1, digest.digest()).toString(16)
    while (checksum.length() < 64) { checksum = "0" + checksum }
    if (checksum != expectedChecksum) {
        file.delete()
        throw new GradleException("Wrong checksum for " + remoteUrl + ": expected: " + expectedChecksum + ", actual: " + checksum)
    }
}

tasks.named('clean', Delete).configure {
    delete fileTree('src/main/cpp') { include 'bootstrap-*.zip' }
}

def bootstrapPackageVariant = project.ext.packageVariant
def downloadBootstraps = tasks.register('downloadBootstraps') {
    doLast {
        def packageVariant = bootstrapPackageVariant
        if (packageVariant == "pacman-android-7") {
            // Pin release and SHA-256 values; do not resolve a moving 'latest' at build time.
            def version = "2026.09.13-r1%2Bpacman.android-7"
            def repository = "termux-pacman/termux-packages"
            downloadBootstrap("aarch64", "e8c793fce673b0468e29168ad7cec9aebb586401d92b1c9d9c86547a793dab6a", version, repository)
            downloadBootstrap("arm", "14584a22a90083fa7c5d9712a27d055de0ef8b91ab3d62f26e15ac16cf7daadd", version, repository)
            downloadBootstrap("i686", "a8cd7f7c6f1c81d6fe36060e796eb469df004dad6404aba1ebbc31847ea9eada", version, repository)
            downloadBootstrap("x86_64", "21cd53ce3176e9615ea728ee3610ef46a123cdff105c4132e1ca07211fd85e0c", version, repository)
        } else if (packageVariant == "apt-android-7") {
            def version = "2026.02.12-r1" + "%2B" + "apt.android-7"
            downloadBootstrap("aarch64", "ea2aeba8819e517db711f8c32369e89e7c52cee73e07930ff91185e1ab93f4f3", version)
            downloadBootstrap("arm", "a38f4d3b2f735f83be2bf54eff463e86dc32a3e2f9f861c1557c4378d249c018", version)
            downloadBootstrap("i686", "f5bc0b025b9f3b420b5fcaeefc064f888f5f22a0d6fd7090f4aac0c33eb3555b", version)
            downloadBootstrap("x86_64", "b7fd0f2e3a4de534be3144f9f91acc768630fc463eaf134ab2e64c545e834f7a", version)
        } else if (packageVariant == "apt-android-5") {
            def version = "2022.04.28-r6" + "+" + packageVariant
            downloadBootstrap("aarch64", "913609d439415c828c5640be1b0561467e539cb1c7080662decaaca2fb4820e7", version)
            downloadBootstrap("arm", "26bfb45304c946170db69108e5eb6e3641aad751406ce106c80df80cad2eccf8", version)
            downloadBootstrap("i686", "46dcfeb5eef67ba765498db9fe4c50dc4690805139aa0dd141a9d8ee0693cd27", version)
            downloadBootstrap("x86_64", "615b590679ee6cd885b7fd2ff9473c845e920f9b422f790bb158c63fe42b8481", version)
        } else {
            throw new GradleException("Unsupported TERMUX_PACKAGE_VARIANT \"" + packageVariant + "\"")
        }
    }
}

// The native bootstrap assembly consumes these ZIPs, so prepare them before any compilation.
tasks.named('preBuild').configure { dependsOn downloadBootstraps }
