name: Attach Debug APKs To Release

on:
  release:
    types:
      - published

jobs:
  attach-apks:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant: ${{ fromJSON(vars.TERMUX_BUILD_ALL_APKS == 'true' && '["pacman-android-7","apt-android-7","apt-android-5"]' || '["pacman-android-7"]') }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_ALL_APKS: ${{ vars.TERMUX_BUILD_ALL_APKS == 'true' }}
      AETHER_ENABLED: ${{ vars.TERMUX_BUILD_ALL_APKS != 'true' && vars.TERMUX_DISABLE_AETHER != 'true' }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.GITHUB_REF }}

      - name: Setup java 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK and NDK
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0' 'ndk;29.0.14206865'
      - name: Prepare Aether toolchain and accompanying sources
        if: env.AETHER_ENABLED == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu
          bash scripts/aether/source-bundle.sh "$RUNNER_TEMP/aether-source"
      - name: Build and attach APKs to release
        shell: bash {0}
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
        run: |
          exit_on_error() {
              echo "$1"
              exit 1
          }

          echo "Setting vars"
          RELEASE_VERSION_NAME="${GITHUB_REF/refs\/tags\//}"
          if ! printf "%s" "${RELEASE_VERSION_NAME/v/}" | grep -qP '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'; then
           exit_on_error "The versionName '${RELEASE_VERSION_NAME/v/}' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html."
          fi

          APK_DIR_PATH="./app/build/outputs/apk/debug"
          APK_VERSION_TAG="$RELEASE_VERSION_NAME+${{ env.PACKAGE_VARIANT }}-github-debug"
          APK_BASENAME_PREFIX="termux-aether-app_$APK_VERSION_TAG"

          echo "Building APKs for 'APK_VERSION_TAG' release"
          export TERMUX_APP_VERSION_NAME="${RELEASE_VERSION_NAME/v/}"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG" # Used by app/build.gradle
          export TERMUX_PACKAGE_VARIANT="${{ env.PACKAGE_VARIANT }}" # Used by app/build.gradle
          build_profile=pixel11
          abis=(arm64-v8a)
          if [ "$BUILD_ALL_APKS" = "true" ]; then
              build_profile=all
              abis=(universal arm64-v8a armeabi-v7a x86_64 x86)
          fi
          if ! ./gradlew :app:assembleDebug -PtermuxBuildProfile="$build_profile" -PaetherEnabled="$AETHER_ENABLED"; then
            exit_on_error "Build failed for '$APK_VERSION_TAG' release."
          fi

          echo "Validating APKs"
          apk_files=()
          release_files=()
          for abi in "${abis[@]}"; do
            if ! test -f "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk"; then
              files_found="$(ls "$APK_DIR_PATH")"
              exit_on_error "Failed to find built APK at '$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk'. Files found: "$'\n'"$files_found"
            fi
            apk_files+=("${APK_BASENAME_PREFIX}_$abi.apk")
            release_files+=("$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk")
          done

          for apk in "${apk_files[@]}"; do
            if ! python3 scripts/aether/verify-package.py "$APK_DIR_PATH/$apk" \
              --enabled "$AETHER_ENABLED" --source-archive "$RUNNER_TEMP/aether-source.tar.gz"; then
              exit_on_error "Aether package/source verification failed."
            fi
          done

          for apk in "${apk_files[@]}"; do
            expected_code=$(sed -n 's/^[[:space:]]*versionCode = \([0-9]*\)$/\1/p' app/build.gradle)
            test -n "$expected_code" || exit_on_error "Missing versionCode"
            apkanalyzer manifest application-id "$APK_DIR_PATH/$apk" | grep -Fx 'com.termux' || exit_on_error "Wrong application ID"
            apkanalyzer manifest version-code "$APK_DIR_PATH/$apk" | grep -Fx "$expected_code" || exit_on_error "Wrong versionCode"
            apkanalyzer manifest version-name "$APK_DIR_PATH/$apk" | grep -Fx "${RELEASE_VERSION_NAME/v/}" || exit_on_error "Wrong versionName"
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK_DIR_PATH/$apk" > "$RUNNER_TEMP/apk-cert.txt" || exit_on_error "APK signature verification failed"
            grep -qi 'certificate SHA-256 digest: b6da01480eefd5fbf2cd3771b8d1021ec791304bdd6c4bf41d3faabad48ee5e1' "$RUNNER_TEMP/apk-cert.txt" || exit_on_error "Unexpected signing certificate"
          done

          # Publish the matching source archive before making its APK available.
          # A source upload failure must leave the release and tag intact for retry.
          if [ "$AETHER_ENABLED" = "true" ]; then
            source_asset="$RUNNER_TEMP/aether-source-${RELEASE_VERSION_NAME}-$(git rev-parse --short=12 HEAD).tar.gz"
            cp "$RUNNER_TEMP/aether-source.tar.gz" "$source_asset" || exit_on_error "Source archive copy failed."
            gh release upload "$RELEASE_VERSION_NAME" "$source_asset" --clobber || exit_on_error "Source upload failed."
          fi

          echo "Generating sha256sums file"
          if ! (cd "$APK_DIR_PATH"; sha256sum "${apk_files[@]}" \
            > "${APK_BASENAME_PREFIX}_sha256sums"); then
            exit_on_error "Generate sha25sums failed for '$APK_VERSION_TAG' release."
          fi

          echo "Attaching APKs to github release"
          if ! gh release upload "$RELEASE_VERSION_NAME" \
          "${release_files[@]}" \
          "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_sha256sums"; then
            exit_on_error "Attach APKs to release failed for '$APK_VERSION_TAG' release."
          fi
